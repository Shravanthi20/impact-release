services:
  db:
    image: postgres:16-alpine
    container_name: impactrelease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: impactrelease
      POSTGRES_PASSWORD: impactrelease_password
      POSTGRES_DB: impactrelease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impactrelease"]
      interval: 5s
      timeout: 5s
      retries: 5

  impactrelease:
    build: .
    container_name: impactrelease-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://impactrelease:impactrelease_password@db:5432/impactrelease
      - PAYPAL_MODE=stub
      - LLM_PROVIDER=gemini
      - GEMINI_MODEL=gemini-3.1-flash-lite
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
